# Migration Playground scenario: ten Ingresses from six teams behind one public ingress-nginx
# class, plus two platform Ingresses on an internal class. A per-Ingress conversion would create
# ten Gateways (ten LoadBalancers) where two controllers serve today. Includes a canary pair,
# external auth, TLS per team (ReferenceGrants when the Gateway lives elsewhere), an IP allow-list
# and ssl-passthrough. Use Design to compare shared, per-team and internal/external topologies.
# All names are synthetic (example.test).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-web
  namespace: team-payments
  creationTimestamp: "2026-01-10T10:00:00Z"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [pay.example.test]
      secretName: payments-tls
  rules:
    - host: pay.example.test
      http:
        paths:
          - {path: "/", pathType: Prefix, backend: {service: {name: payments-web, port: {number: 80}}}}
          - {path: "/checkout", pathType: Prefix, backend: {service: {name: payments-web, port: {number: 80}}}}
          - {path: "/webhooks", pathType: Prefix, backend: {service: {name: payments-web, port: {number: 80}}}}
---
