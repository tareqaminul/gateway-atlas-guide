apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: {name: nginx}
spec: {controllerName: gateway.nginx.org/nginx-gateway-controller}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: web, namespace: default}
spec: {gatewayClassName: nginx, listeners: [{name: http, protocol: HTTP, port: 80}]}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: cafe, namespace: default}
spec: {parentRefs: [{name: web}], rules: [{backendRefs: [{name: cafe, port: 80}]}]}
---
apiVersion: v1
kind: Service
metadata: {name: cafe, namespace: default}
spec: {ports: [{name: http, port: 80}]}
