apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-api
  namespace: shop-api
  creationTimestamp: "2026-04-02T08:00:00Z"
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.test
      http:
        paths:
          - {path: "/orders(/|$)(.*)", pathType: ImplementationSpecific, backend: {service: {name: orders, port: {number: 80}}}}
          - {path: "/api/v1/health", pathType: Prefix, backend: {service: {name: orders, port: {number: 80}}}}
          - {path: "/actuator/health", pathType: Prefix, backend: {service: {name: orders, port: {number: 80}}}}
          - {path: "/api/v1/carts", pathType: Prefix, backend: {service: {name: orders, port: {number: 80}}}}
          - {path: "/api/v1/checkout", pathType: Prefix, backend: {service: {name: orders, port: {number: 80}}}}
          - {path: "/api/v1/payments", pathType: Prefix, backend: {service: {name: orders, port: {number: 80}}}}
          - {path: "/api/v1/refunds", pathType: Prefix, backend: {service: {name: orders, port: {number: 80}}}}
          - {path: "/api/v1/invoices", pathType: Prefix, backend: {service: {name: orders, port: {number: 80}}}}
---
