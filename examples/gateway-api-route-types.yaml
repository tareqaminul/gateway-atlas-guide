# api.example.com: NGINX Gateway Fabric 2.8.0 policies and filters on one route. Policy specs are
# minimal: they show attachment, not tuning.
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: api
---
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: proxy-config
  namespace: nginx-gateway
spec:
  ipFamily: dual
  serverTokens: 'off'
  telemetry:
    exporter:
      endpoint: otel-collector.observability.svc:4317
    serviceName: api-edge
  rewriteClientIP:
    mode: ProxyProtocol
    trustedAddresses:
    - type: CIDR
      value: 198.51.100.0/24
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api-gateway
  namespace: api
spec:
  gatewayClassName: nginx
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    hostname: api.example.com
    tls:
      certificateRefs:
      - name: api-tls
---
apiVersion: v1
kind: Secret
metadata:
  name: api-tls
  namespace: api
type: kubernetes.io/tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-api
  namespace: api
spec:
  parentRefs:
  - name: api-gateway
  hostnames:
  - api.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/orders
    backendRefs:
    - name: orders
      port: 8080
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: orders-buffering
  - matches:
    - path:
        type: PathPrefix
        value: /v1/admin
    backendRefs:
    - name: admin
      port: 8080
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: AuthenticationFilter
        name: admin-basic
  - matches:
    - path:
        type: PathPrefix
        value: /v1/legacy
    backendRefs:
    - name: legacy-billing
      port: 8443
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /billing
---
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: api-body-limits
  namespace: api
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: api-gateway
  body:
    maxSize: 10m
    timeout: 30s
  keepAlive:
    requests: 100
---
apiVersion: gateway.nginx.org/v1alpha1
kind: ProxySettingsPolicy
metadata:
  name: orders-timeouts
  namespace: api
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: public-api
---
apiVersion: gateway.nginx.org/v1alpha1
kind: UpstreamSettingsPolicy
metadata:
  name: orders-upstream
  namespace: api
spec:
  targetRefs:
  - group: core
    kind: Service
    name: orders
  keepAlive:
    connections: 32
  loadBalancingMethod: least_conn
  zoneSize: 1m
---
apiVersion: gateway.nginx.org/v1alpha1
kind: RateLimitPolicy
metadata:
  name: api-rate-limit
  namespace: api
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: public-api
---
apiVersion: gateway.nginx.org/v1alpha2
kind: ObservabilityPolicy
metadata:
  name: api-tracing
  namespace: api
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: public-api
  tracing:
    strategy: ratio
    ratio: 10
---
apiVersion: gateway.nginx.org/v1alpha1
kind: AccessPolicy
metadata:
  name: admin-allow-office
  namespace: api
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: public-api
---
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: orders-buffering
  namespace: api
spec:
  snippets:
  - context: http.server.location
    value: proxy_buffering off;
---
apiVersion: gateway.nginx.org/v1alpha1
kind: AuthenticationFilter
metadata:
  name: admin-basic
  namespace: api
spec:
  type: Basic
  basic:
    secretRef:
      name: admin-htpasswd
    realm: Admin
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-htpasswd
  namespace: api
type: Opaque
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: legacy-billing-tls
  namespace: api
spec:
  targetRefs:
  - group: ''
    kind: Service
    name: legacy-billing
  validation:
    caCertificateRefs:
    - group: ''
      kind: ConfigMap
      name: billing-ca
    hostname: billing.internal.example.test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-ca
  namespace: api
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    SYNTHETIC-PLACEHOLDER
    -----END CERTIFICATE-----
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: api
spec:
  selector:
    app: orders
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: api
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: orders
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/api/orders:1.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: api
spec:
  selector:
    app: admin
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: api
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: admin
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/api/admin:1.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-billing
  namespace: api
spec:
  selector:
    app: legacy-billing
  ports:
  - name: http
    port: 8443
    targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-billing
  namespace: api
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: legacy-billing
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/api/legacy-billing:1.0.0
        ports:
        - containerPort: 8443
---
# releases.example.com: progressive delivery, 90/10 blue/green, a header-forced canary, a query
# A/B experiment, a mirror to a shadow Service, and a maintenance redirect on a second route.
apiVersion: v1
kind: Namespace
metadata:
  name: releases
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: releases-gw
  namespace: releases
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout-progressive
  namespace: releases
spec:
  parentRefs:
  - name: releases-gw
  hostnames:
  - releases.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: x-canary
        value: always
    backendRefs:
    - name: checkout-green
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /
      queryParams:
      - name: variant
        value: b
    backendRefs:
    - name: checkout-experiment-b
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: checkout-blue
      port: 80
      weight: 90
    - name: checkout-green
      port: 80
      weight: 10
    filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          name: checkout-shadow
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout-maintenance
  namespace: releases
spec:
  parentRefs:
  - name: releases-gw
  hostnames:
  - releases.example.com
  rules:
  - matches:
    - path:
        type: Exact
        value: /maintenance
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /status
        statusCode: 302
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-blue
  namespace: releases
spec:
  selector:
    app: checkout
    track: blue
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-blue
  namespace: releases
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: checkout
      track: blue
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/checkout/checkout-blue:1.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-green
  namespace: releases
spec:
  selector:
    app: checkout
    track: green
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-green
  namespace: releases
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: checkout
      track: green
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/checkout/checkout-green:1.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-experiment-b
  namespace: releases
spec:
  selector:
    app: checkout
    track: experiment-b
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-experiment-b
  namespace: releases
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: checkout
      track: experiment-b
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/checkout/checkout-experiment-b:1.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-shadow
  namespace: releases
spec:
  selector:
    app: checkout
    track: shadow
  ports:
