# One Gateway, four protocols: GRPCRoute on an HTTPS listener that accepts only GRPCRoute,
# TLSRoute (passthrough), TCPRoute and UDPRoute, with routes in another namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: edge-l4
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: multi-protocol
  namespace: edge-l4
spec:
  gatewayClassName: nginx
  listeners:
  - name: grpc
    port: 443
    protocol: HTTPS
    hostname: grpc.example.com
    tls:
      certificateRefs:
      - name: grpc-tls
    allowedRoutes:
      namespaces:
        from: All
      kinds:
      - kind: GRPCRoute
  - name: tls-passthrough
    port: 8443
    protocol: TLS
    hostname: vault.example.com
    tls:
      mode: Passthrough
    allowedRoutes:
      namespaces:
        from: All
  - name: redis
    port: 6379
    protocol: TCP
    allowedRoutes:
      namespaces:
        from: All
  - name: syslog
    port: 514
    protocol: UDP
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: v1
kind: Secret
metadata:
  name: grpc-tls
  namespace: edge-l4
type: kubernetes.io/tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: inventory-grpc
  namespace: platform
spec:
  parentRefs:
  - name: multi-protocol
    namespace: edge-l4
    sectionName: grpc
  hostnames:
  - grpc.example.com
  rules:
  - matches:
    - method:
        service: inventory.v1.Inventory
    backendRefs:
    - name: inventory-grpc
      port: 9090
  - matches:
    - method:
        service: pricing.v1.Pricing
        method: Quote
    backendRefs:
    - name: pricing-grpc
      port: 9090
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: vault
  namespace: platform
spec:
  parentRefs:
  - name: multi-protocol
    namespace: edge-l4
    sectionName: tls-passthrough
  hostnames:
  - vault.example.com
  rules:
  - backendRefs:
    - name: vault
      port: 8200
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: redis
  namespace: platform
spec:
  parentRefs:
  - name: multi-protocol
    namespace: edge-l4
    sectionName: redis
  rules:
  - backendRefs:
    - name: redis
      port: 6379
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: syslog
  namespace: platform
spec:
  parentRefs:
  - name: multi-protocol
    namespace: edge-l4
    sectionName: syslog
  rules:
  - backendRefs:
    - name: syslog-collector
      port: 514
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-grpc
  namespace: platform
spec:
  selector:
    app: inventory-grpc
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-grpc
  namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: inventory-grpc
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/platform/inventory-grpc:1.0.0
        ports:
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-grpc
  namespace: platform
spec:
  selector:
    app: pricing-grpc
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-grpc
  namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: pricing-grpc
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/platform/pricing-grpc:1.0.0
        ports:
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: platform
spec:
  selector:
    app: vault
  ports:
  - name: http
    port: 8200
    targetPort: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: platform
spec:
  replicas: 3
  selector:
    matchLabels: &id001
      app: vault
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/platform/vault:1.0.0
        ports:
        - containerPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: platform
spec:
  selector:
    app: redis
  ports:
  - name: http
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: redis
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/platform/redis:1.0.0
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: syslog-collector
  namespace: platform
spec:
  selector:
    app: syslog-collector
  ports:
  - name: http
    port: 514
    targetPort: 514
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslog-collector
  namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: syslog-collector
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/platform/syslog-collector:1.0.0
        ports:
        - containerPort: 514
