# Gateway API - Various Route Types: NGINX Gateway Fabric with HTTPRoute, GRPCRoute, TLSRoute, TCPRoute and
# UDPRoute. Also covers:
# - a shared multi-team Gateway with namespace selectors and ReferenceGrants;
# - the NGF policy and filter set;
# - weights, header and query matches, mirroring and redirects.
# Every relationship resolves.
# Synthetic: example.com hosts, registry.example.com images, RFC 5737 addresses; Secrets carry no data.
# One GatewayClass for NGINX Gateway Fabric, configured by an NginxProxy (parametersRef).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nginx
spec:
  controllerName: gateway.nginx.org/nginx-gateway-controller
  parametersRef:
    group: gateway.nginx.org
    kind: NginxProxy
    name: proxy-config
    namespace: nginx-gateway
---
# hello.example.com: the smallest path, Gateway, HTTPRoute, Service.
apiVersion: v1
kind: Namespace
metadata:
  name: hello
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hello-gateway
  namespace: hello
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: hello.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: hello
spec:
  parentRefs:
  - name: hello-gateway
  hostnames:
  - hello.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hello-web
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: hello
spec:
  selector:
    app: hello-web
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: hello
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: hello-web
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/hello/hello-web:1.0.0
        ports:
        - containerPort: 8080
---
# A platform-owned shared Gateway: the HTTP listener only redirects to HTTPS; the HTTPS wildcard
# listener admits namespaces labelled gateway-access=shared and uses a certificate from namespace
# certs through a ReferenceGrant. Two teams share www.example.com by path; cross-namespace backends
# are granted.
apiVersion: v1
kind: Namespace
metadata:
  name: infra-gateways
---
apiVersion: v1
kind: Namespace
metadata:
  name: certs
---
apiVersion: v1
kind: Namespace
metadata:
  name: storefront
  labels:
    gateway-access: shared
---
apiVersion: v1
kind: Namespace
metadata:
  name: checkout
  labels:
    gateway-access: shared
---
apiVersion: v1
kind: Namespace
metadata:
  name: search
  labels:
    gateway-access: shared
---
apiVersion: v1
kind: Namespace
metadata:
  name: partners
  labels:
    gateway-access: shared
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-edge
  namespace: infra-gateways
spec:
  gatewayClassName: nginx
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
  - name: https-wildcard
    port: 443
    protocol: HTTPS
    hostname: '*.example.com'
    tls:
      mode: Terminate
      certificateRefs:
      - name: wildcard-example-com
        namespace: certs
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gateway-access: shared
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: gateways-read-wildcard
  namespace: certs
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: infra-gateways
  to:
  - group: ''
    kind: Secret
    name: wildcard-example-com
---
apiVersion: v1
kind: Secret
metadata:
  name: wildcard-example-com
  namespace: certs
type: kubernetes.io/tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: infra-gateways
spec:
  parentRefs:
  - name: shared-edge
    sectionName: http
  hostnames: []
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront
  namespace: storefront
spec:
  parentRefs:
  - name: shared-edge
    namespace: infra-gateways
    sectionName: https-wildcard
  hostnames:
  - www.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: storefront-web
      port: 80
  - matches:
    - path:
        type: PathPrefix
        value: /search
    backendRefs:
    - name: search-api
      port: 8080
      namespace: search
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout
  namespace: checkout
spec:
  parentRefs:
  - name: shared-edge
    namespace: infra-gateways
    sectionName: https-wildcard
  hostnames:
  - www.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /checkout
    - path:
        type: PathPrefix
        value: /cart
    backendRefs:
    - name: checkout-api
      port: 8080
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Team
          value: checkout
  - matches:
    - path:
        type: PathPrefix
        value: /payments
    backendRefs:
    - name: payments-gateway
      port: 443
      namespace: payments-external
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: search-direct
  namespace: search
spec:
  parentRefs:
  - name: shared-edge
    namespace: infra-gateways
    sectionName: https-wildcard
  hostnames:
  - search.example.com
  rules:
  - backendRefs:
    - name: search-api
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: partners
  namespace: partners
spec:
  parentRefs:
  - name: shared-edge
    namespace: infra-gateways
    sectionName: https-wildcard
  hostnames:
  - partners.example.com
  rules:
  - backendRefs:
    - name: partner-portal
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: storefront-to-search
  namespace: search
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: storefront
  to:
  - group: ''
    kind: Service
    name: search-api
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-web
  namespace: storefront
spec:
  selector:
    app: storefront-web
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-web
  namespace: storefront
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: storefront-web
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/storefront/storefront-web:1.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: checkout
spec:
  selector:
    app: checkout-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: checkout
spec:
  replicas: 2
  selector:
    matchLabels: &id001
      app: checkout-api
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: registry.example.com/checkout/checkout-api:1.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
spec:
  selector:
    app: search-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
