name: Feedback
description: Usability, wording, missing features or ideas
labels: [feedback]
body:
  - type: input
    id: release
    attributes:
      label: Atlas release
      description: From Help → About
      placeholder: "2.2.1"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Overall, Import, Live cluster, Canvas, Inspector / search / diagnostics, Migration Playground — Discover, Migration Playground — Design, CRD explorer, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What worked, what was confusing, and what you would change. Screenshots are welcome; please remove private names first.
    validations:
      required: true
