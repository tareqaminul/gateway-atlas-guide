<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Three Gateway patterns and where the Migration Playground fits</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132131"/>
      <stop offset="1" stop-color="#0e1824"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb5a8"/>
      <stop offset="0.5" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#e8954a"/>
    </linearGradient>
    <marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9fb1c3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" rx="18" fill="url(#bg)"/>
  <text x="32" y="44" fill="#e8eef5" font-size="22" font-weight="700">Three Gateway patterns, and where the Migration Playground fits</text>
  <text x="32" y="68" fill="#9fb1c3" font-size="14">Choose the boundary first; then choose how much infrastructure to share.</text>

  <!-- A: Shared -->
  <rect x="32" y="92" width="364" height="316" rx="14" fill="#1a2b3d" stroke="#3fb5a8"/>
  <rect x="32" y="92" width="6" height="316" rx="3" fill="#3fb5a8"/>
  <text x="54" y="122" fill="#e8eef5" font-size="17" font-weight="700">A · Shared Gateway</text>
  <rect x="54" y="136" width="322" height="96" rx="10" fill="#17363a"/>
  <g font-size="11" font-weight="600" fill="#e8eef5" text-anchor="middle">
    <rect x="165" y="146" width="100" height="26" rx="6" fill="#22384f" stroke="#3fb5a8"/><text x="215" y="163">Gateway</text>
    <path d="M215 172 V186 M110 186 H320 M110 186 V198 M215 186 V198 M320 186 V198" stroke="#3fb5a8" stroke-width="1.6" fill="none"/>
    <rect x="66" y="198" width="88" height="24" rx="6" fill="#22384f" stroke="#3fb5a8"/><text x="110" y="214">Team A routes</text>
    <rect x="171" y="198" width="88" height="24" rx="6" fill="#22384f" stroke="#3fb5a8"/><text x="215" y="214">Team B routes</text>
    <rect x="276" y="198" width="88" height="24" rx="6" fill="#22384f" stroke="#3fb5a8"/><text x="320" y="214">Team C routes</text>
  </g>
  <text x="54" y="260" fill="#3fb5a8" font-size="11" font-weight="700" letter-spacing="1.2">USE WHEN</text>
  <text x="54" y="280" fill="#e8eef5" font-size="13.5">Most apps share exposure, TLS and</text>
  <text x="54" y="298" fill="#e8eef5" font-size="13.5">security posture; teams own their routes.</text>
  <text x="54" y="334" fill="#e8954a" font-size="11" font-weight="700" letter-spacing="1.2">CAVEAT</text>
  <text x="54" y="354" fill="#b9c7d6" font-size="13">Shared blast radius: govern hostname</text>
  <text x="54" y="372" fill="#b9c7d6" font-size="13">ownership, quotas and policy conflicts.</text>

  <!-- B: Boundary-specific -->
  <rect x="418" y="92" width="364" height="316" rx="14" fill="#1a2b3d" stroke="#5b8def"/>
  <rect x="418" y="92" width="6" height="316" rx="3" fill="#5b8def"/>
  <text x="440" y="122" fill="#e8eef5" font-size="17" font-weight="700">B · Boundary-specific</text>
  <rect x="440" y="136" width="322" height="96" rx="10" fill="#1c2c4d"/>
  <g font-size="11" font-weight="600" fill="#e8eef5" text-anchor="middle">
    <rect x="456" y="146" width="128" height="26" rx="6" fill="#22384f" stroke="#5b8def"/><text x="520" y="163">Public Gateway</text>
    <rect x="618" y="146" width="128" height="26" rx="6" fill="#22384f" stroke="#5b8def"/><text x="682" y="163">Internal Gateway</text>
    <path d="M520 172 V198 M682 172 V198" stroke="#5b8def" stroke-width="1.6"/>
    <rect x="456" y="198" width="128" height="24" rx="6" fill="#22384f" stroke="#5b8def"/><text x="520" y="214">Public routes</text>
    <rect x="618" y="198" width="128" height="24" rx="6" fill="#22384f" stroke="#5b8def"/><text x="682" y="214">Internal routes</text>
  </g>
  <text x="440" y="260" fill="#5b8def" font-size="11" font-weight="700" letter-spacing="1.2">USE WHEN</text>
  <text x="440" y="280" fill="#e8eef5" font-size="13.5">Separate public and internal, prod and</text>
  <text x="440" y="298" fill="#e8eef5" font-size="13.5">non-prod, or compliance zones.</text>
  <text x="440" y="334" fill="#e8954a" font-size="11" font-weight="700" letter-spacing="1.2">CAVEAT</text>
  <text x="440" y="354" fill="#b9c7d6" font-size="13">More listeners, addresses and operations;</text>
  <text x="440" y="372" fill="#b9c7d6" font-size="13">teams still share each Gateway.</text>

  <!-- C: Dedicated -->
  <rect x="804" y="92" width="364" height="316" rx="14" fill="#1a2b3d" stroke="#e8954a"/>
  <rect x="804" y="92" width="6" height="316" rx="3" fill="#e8954a"/>
  <text x="826" y="122" fill="#e8eef5" font-size="17" font-weight="700">C · Dedicated Gateway</text>
  <rect x="826" y="136" width="322" height="96" rx="10" fill="#3a2a1a"/>
  <g font-size="11" font-weight="600" fill="#e8eef5" text-anchor="middle">
    <rect x="838" y="142" width="144" height="84" rx="8" fill="none" stroke="#e8954a" stroke-opacity="0.6"/>
    <rect x="992" y="142" width="144" height="84" rx="8" fill="none" stroke="#e8954a" stroke-opacity="0.6"/>
    <rect x="850" y="150" width="120" height="26" rx="6" fill="#22384f" stroke="#e8954a"/><text x="910" y="167">Tenant A Gateway</text>
    <rect x="1004" y="150" width="120" height="26" rx="6" fill="#22384f" stroke="#e8954a"/><text x="1064" y="167">Tenant B Gateway</text>
    <path d="M910 176 V194 M1064 176 V194" stroke="#e8954a" stroke-width="1.6"/>
    <rect x="850" y="194" width="120" height="24" rx="6" fill="#22384f" stroke="#e8954a"/><text x="910" y="210">A routes</text>
    <rect x="1004" y="194" width="120" height="24" rx="6" fill="#22384f" stroke="#e8954a"/><text x="1064" y="210">B routes</text>
  </g>
  <text x="826" y="260" fill="#e8954a" font-size="11" font-weight="700" letter-spacing="1.2">USE WHEN</text>
  <text x="826" y="280" fill="#e8eef5" font-size="13.5">A tenant or critical app needs its own TLS,</text>
  <text x="826" y="298" fill="#e8eef5" font-size="13.5">load balancer, releases or isolation.</text>
  <text x="826" y="334" fill="#e8954a" font-size="11" font-weight="700" letter-spacing="1.2">CAVEAT</text>
  <text x="826" y="354" fill="#b9c7d6" font-size="13">Higher cost and sprawl; verify real</text>
  <text x="826" y="372" fill="#b9c7d6" font-size="13">data-plane isolation, not just separate CRDs.</text>

  <!-- Spectrum -->
  <rect x="60" y="430" width="1080" height="6" rx="3" fill="url(#spectrum)"/>
  <path d="M60 433 H50" stroke="#9fb1c3" stroke-width="2" marker-end="url(#end)"/>
  <path d="M1140 433 H1150" stroke="#9fb1c3" stroke-width="2" marker-end="url(#end)"/>
  <text x="60" y="458" fill="#9fb1c3" font-size="12.5">Extreme: one shared Gateway</text>
  <text x="600" y="458" fill="#9fb1c3" font-size="12.5" text-anchor="middle">New Gateway gets its own data plane and Service (e.g., LoadBalancer)</text>
  <text x="1140" y="458" fill="#9fb1c3" font-size="12.5" text-anchor="end">Extreme: a Gateway per app</text>

  <!-- Playground: Discover and Draft -->
  <rect x="32" y="474" width="750" height="72" rx="12" fill="#1a2b3d" stroke="#2f4a63"/>
  <text x="52" y="500" fill="#5fc4c9" font-size="11" font-weight="700" letter-spacing="1.2">PLAYGROUND · 1 · DISCOVER</text>
  <text x="52" y="520" fill="#e8eef5" font-size="13.5">Shows how hosts, snippets and TLS are shared today, which tells you where the real</text>
  <text x="52" y="537" fill="#e8eef5" font-size="13.5">trust, exposure and ownership boundaries are before you pick a pattern.</text>
  <rect x="804" y="474" width="364" height="72" rx="12" fill="#1d2440" stroke="#b69cf0" stroke-dasharray="6 4"/>
  <text x="824" y="500" fill="#b69cf0" font-size="11" font-weight="700" letter-spacing="1.2">DRAFT (LEGACY PER-INGRESS)</text>
  <text x="824" y="520" fill="#e8eef5" font-size="13.5">One Gateway per Ingress: lift and shift,</text>
  <text x="824" y="537" fill="#e8eef5" font-size="13.5">past C. Explore mappings; rarely advisable.</text>

  <!-- Playground: Design -->
  <rect x="32" y="560" width="1136" height="72" rx="12" fill="#17303a" stroke="#5fc4c9" stroke-opacity="0.7"/>
  <rect x="418" y="560" width="364" height="72" rx="12" fill="#1f4a55" stroke="#5fc4c9"/>
  <text x="52" y="586" fill="#5fc4c9" font-size="11" font-weight="700" letter-spacing="1.2">PLAYGROUND · 2 · DESIGN</text>
  <text x="52" y="606" fill="#e8eef5" font-size="13.5">Build any of the three: add Gateways,</text>
  <text x="52" y="623" fill="#e8eef5" font-size="13.5">attach hosts, Check Design.</text>
  <text x="438" y="586" fill="#5fc4c9" font-size="11" font-weight="700" letter-spacing="1.2">FOCUS: THE OWNERSHIP MODEL</text>
  <text x="438" y="606" fill="#e8eef5" font-size="13.5">Who owns each host, route namespace,</text>
  <text x="438" y="623" fill="#e8eef5" font-size="13.5">listener and certificate.</text>
  <text x="824" y="606" fill="#e8eef5" font-size="13.5">Shows the load-balancer count and</text>
  <text x="824" y="623" fill="#e8eef5" font-size="13.5">decisions each extra Gateway brings.</text>

  <!-- Decision rule -->
  <rect x="32" y="646" width="1136" height="38" rx="10" fill="#05090e"/>
  <text x="600" y="671" fill="#ffffff" font-size="14.5" font-weight="700" text-anchor="middle">Decision rule: add a Gateway only for a meaningful trust, exposure or operational boundary.</text>
</svg>
